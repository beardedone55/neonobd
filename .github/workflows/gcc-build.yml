name: Build Project (GCC)
run-name: Building latest version of ${{ github.repository }} with GCC and CPPCHECK
on:
  pull_request:
    branches:
      - master
jobs:
  build_project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
      - name: Install Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get -y install cppcheck
          sudo apt-get -y install libsystemd-dev
          sudo apt-get -y install qt6-base-dev
      - name: Configure cmake
        run: |
          cmake -B build src -DRUN_CPPCHECK=ON -DCMAKE_CXX_COMPILER=g++ \
             -DTESTING_ENABLED=ON -DINTERACTIVE_TESTS=ON
      - name: Compile project
        run: cmake --build build -j

